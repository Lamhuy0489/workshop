<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" width="1500" height="880" style="background:#FFFFFF; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  
  <defs>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1E293B"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0284C7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#D97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8C4FFF"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>


  <!-- Header -->
  <text x="35" y="40" fill="#0F172A" font-size="20" font-weight="800" letter-spacing="-0.5">END-TO-END PROCESSING SEQUENCE &amp; EVENT-DRIVEN DATAFLOW</text>
  <text x="1465" y="40" fill="#64748B" font-size="12" font-weight="600" text-anchor="end">S3 Presigned Ingestion -&gt; Lambda 214ms -&gt; Hybrid OCR -&gt; LLM Translation -&gt; DynamoDB State</text>
  <line x1="35" y1="55" x2="1465" y2="55" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Participants Header Lifelines -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#0284C7" stroke="#0284C7"/>
    <text x="80" y="25" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Client Browser (SPA)</text>
    <line x1="80" y1="40" x2="80" y2="760" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(250, 75)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#0F172A" stroke="#0F172A"/>
    <text x="80" y="25" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Web API (ALB / EC2)</text>
    <line x1="80" y1="40" x2="80" y2="760" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(460, 75)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#D97706" stroke="#D97706"/>
    <text x="80" y="25" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Amazon S3 Storage</text>
    <line x1="80" y1="40" x2="80" y2="760" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(670, 75)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#16A34A" stroke="#16A34A"/>
    <text x="80" y="25" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">AWS Lambda (214ms)</text>
    <line x1="80" y1="40" x2="80" y2="760" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(880, 75)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#0F172A" stroke="#0F172A"/>
    <text x="80" y="25" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Hybrid Parser Engine</text>
    <line x1="80" y1="40" x2="80" y2="760" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(1090, 75)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#8C4FFF" stroke="#8C4FFF"/>
    <text x="80" y="25" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">AI / Key Tour Manager</text>
    <line x1="80" y1="40" x2="80" y2="760" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(1300, 75)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#0284C7" stroke="#0284C7"/>
    <text x="80" y="25" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Amazon DynamoDB</text>
    <line x1="80" y1="40" x2="80" y2="760" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Sequence Steps -->
  <line x1="120" y1="150" x2="330" y2="150" stroke="#0F172A" stroke-width="1.8" marker-end="url(#arr-dark)"/>
  <text x="225" y="142" fill="#0F172A" font-size="11" font-weight="600" text-anchor="middle">1. Request S3 Presigned Upload URL</text>

  <line x1="330" y1="185" x2="120" y2="185" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-dark)"/>
  <text x="225" y="177" fill="#64748B" font-size="10.5" text-anchor="middle">2. Return SigV4 Presigned URL (uploads/&lt;job_id&gt;/...)</text>

  <line x1="120" y1="225" x2="540" y2="225" stroke="#D97706" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="330" y="217" fill="#D97706" font-size="11" font-weight="700" text-anchor="middle">3. Direct HTTP PUT Binary (Bypass 10MB API Gateway limit!)</text>

  <line x1="540" y1="265" x2="750" y2="265" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="645" y="257" fill="#16A34A" font-size="11" font-weight="600" text-anchor="middle">4. Trigger Event s3:ObjectCreated</text>

  <line x1="750" y1="305" x2="1380" y2="305" stroke="#0284C7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="1065" y="297" fill="#0284C7" font-size="11" font-weight="600" text-anchor="middle">5. PutItem [job_id, status: 'RECEIVED_VIA_S3_EVENT', created_at]</text>

  <line x1="750" y1="345" x2="960" y2="345" stroke="#0F172A" stroke-width="1.8" marker-end="url(#arr-dark)"/>
  <text x="855" y="337" fill="#0F172A" font-size="11" font-weight="600" text-anchor="middle">6. Initialize Hybrid Extraction Job</text>

  <!-- ALT FRAME -->
  <rect x="75" y="375" width="1340" height="210" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,4"/>
  <rect x="75" y="375" width="170" height="24" rx="4" fill="#64748B"/>
  <text x="160" y="391" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">ALT: HYBRID PARSING PATH</text>

  <text x="95" y="420" fill="#16A34A" font-size="11" font-weight="700">[Char Density &gt;= 0.05: Digital PDF (85% of documents)]</text>
  <line x1="960" y1="435" x2="1010" y2="435" stroke="#16A34A" stroke-width="2"/>
  <line x1="1010" y1="435" x2="1010" y2="460" stroke="#16A34A" stroke-width="2"/>
  <line x1="1010" y1="460" x2="960" y2="460" stroke="#16A34A" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="1025" y="452" fill="#16A34A" font-size="10.5" font-weight="600">Fast-Path Native (PyMuPDF: 0.28s / page, 0$ Cloud Cost)</text>

  <text x="95" y="495" fill="#8C4FFF" font-size="11" font-weight="700">[Char Density &lt; 0.05: Scanned / Blurred / Handwriting Pages]</text>
  <line x1="960" y1="515" x2="1170" y2="515" stroke="#8C4FFF" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <text x="1065" y="507" fill="#8C4FFF" font-size="10.5" font-weight="600">Dispatch Vision Request (Qwen2.5-VL via Kaggle GPU)</text>
  <line x1="1170" y1="545" x2="960" y2="545" stroke="#8C4FFF" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-purple)"/>
  <text x="1065" y="537" fill="#8C4FFF" font-size="10.5" text-anchor="middle">Return Extracted Text &amp; Tables (Or Failover to Gemini Flash)</text>

  <line x1="960" y1="610" x2="1170" y2="610" stroke="#8C4FFF" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  <text x="1065" y="602" fill="#8C4FFF" font-size="11" font-weight="600" text-anchor="middle">7. Translate with Key Tour Manager (Domain Terminology)</text>
  
  <line x1="1170" y1="640" x2="960" y2="640" stroke="#8C4FFF" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-purple)"/>
  <text x="1065" y="632" fill="#8C4FFF" font-size="10.5" text-anchor="middle">Return Bilingual Vietnamese Markdown Result</text>

  <line x1="960" y1="675" x2="540" y2="675" stroke="#D97706" stroke-width="1.8" marker-end="url(#arr-orange)"/>
  <text x="750" y="667" fill="#D97706" font-size="11" font-weight="600" text-anchor="middle">8. Store Published Artifacts (outputs/&lt;job_id&gt;/... .md, .docx, .pdf)</text>

  <line x1="960" y1="710" x2="1380" y2="710" stroke="#0284C7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="1170" y="702" fill="#0284C7" font-size="11" font-weight="600" text-anchor="middle">9. UpdateItem [status: 'COMPLETED', latency: '0.28s', total_pages: 11]</text>

  <line x1="120" y1="745" x2="330" y2="745" stroke="#0284C7" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="225" y="737" fill="#0284C7" font-size="11" font-weight="600" text-anchor="middle">10. Fetch Status &amp; Download Links</text>
  
  <line x1="330" y1="775" x2="120" y2="775" stroke="#16A34A" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="225" y="767" fill="#16A34A" font-size="11" font-weight="700" text-anchor="middle">11. Render Side-by-Side Editor &amp; Instant Download</text>

  <!-- Bottom Execution Metrics Bar -->
  <rect x="75" y="805" width="1340" height="40" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="745" y="830" fill="#1E40AF" font-size="11.5" font-weight="700" text-anchor="middle">
    Measured Real Telemetry: Lambda Trigger = 214 ms | Fast-Path Execution = 0.28 s/page | DynamoDB Update &lt; 8 ms | Zero S3 Upload Bottleneck
  </text>
</svg>